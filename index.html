<!DOCTYPE html>
<html>
<head>
    <title>⚔️ PVE for the Reroll</title>
<link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=1vs_KUBu829bGCS8nZXYI_-lGjFgFEOne&sz=w64">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <script src="https://w.soundcloud.com/player/api.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --red:    #ff3c3c;
      --red-glow: rgba(255,60,60,0.55);
      --green:  #3fffa8;
      --blue:   #4d9fff;
      --bg:     #0d0d14;
      --surface: rgba(255,255,255,0.045);
      --surface-hover: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.09);
      --border-hover: rgba(63,255,168,0.45);
      --text:   #f0f0f0;
      --muted:  rgba(255,255,255,0.45);
    }
    * { box-sizing: border-box; }
    body {
      background-color: var(--bg); color: var(--text);
      font-family: 'Inter', 'Segoe UI', sans-serif;
      padding-bottom: 60px; position: relative; min-height: 100vh;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: url('https://drive.google.com/thumbnail?id=1lZ8dw3517sG9HX6HVAt-WChH7yiv_BNk&sz=w1000');
      background-size: cover; background-position: center; background-attachment: fixed;
      opacity: 0.06; z-index: 0; pointer-events: none;
    }
    body::after {
      content: ''; position: fixed; inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(255,60,60,0.07) 0%, transparent 65%);
      z-index: 0; pointer-events: none;
    }
    #scPlayer {
      position: fixed; bottom: -300px; left: 0;
      width: 100%; height: 166px;
      border: none; z-index: -1; pointer-events: none;
    }
    #header {
      position: sticky; top: 0;
      background: rgba(10,10,18,0.88);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      z-index: 100; padding: 6px 20px;
      border-bottom: 1px solid rgba(255,60,60,0.3);
      box-shadow: 0 2px 40px rgba(0,0,0,0.6);
    }
    .header-wrap { display: flex; align-items: center; width: 100%; min-height: 68px; gap: 16px; overflow: hidden; }
    .header-left { width: 220px; flex-shrink: 0; display: flex; flex-direction: row; gap: 8px; align-items: center; align-self: center; border: none; }
    .header-right { width: 220px; flex-shrink: 0; display: flex; justify-content: flex-start; align-items: center; }
    .header-center { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .form-select {
      background-color: #0f0f1a !important; border: 1px solid rgba(255,255,255,0.12) !important;
      color: #fff !important; border-radius: 8px !important;
      font-size: 0.75rem; transition: border-color 0.2s; padding: 4px 8px;
    }
    .form-select:focus { border-color: var(--green) !important; box-shadow: 0 0 0 2px rgba(63,255,168,0.15) !important; outline: none !important; }
    .form-select:focus-visible { outline: none !important; }
    .header-left, .header-left * { user-select: none; cursor: default; }
    select.form-select { cursor: pointer; }
    .form-select option { background-color: #0f0f1a; color: #fff; }
    .main-title {
      font-family: 'Rajdhani', sans-serif; font-size: 1.55rem; font-weight: 700;
      letter-spacing: 4px; display: flex; align-items: center; gap: 10px;
      margin: 0; white-space: nowrap; user-select: none;
    }
    .badges-row { display: flex; gap: 6px; align-items: center; justify-content: center; user-select: none; }
    .revive-btn-wrap { display: flex; justify-content: center; }
    .word-pve { color: #ffffff; letter-spacing: 4px; }
    .word-for {
      cursor: pointer; user-select: none;
      transition: color 0.3s, opacity 0.2s;
      animation: glowFor 2.5s ease-in-out infinite alternate;
    }
    .word-for:hover { opacity: 0.75; }
    @keyframes glowFor {
      from { text-shadow: 0 0 6px var(--for-color,#ff3c3c), 0 0 18px var(--for-glow,rgba(255,60,60,0.6)); }
      to   { text-shadow: 0 0 14px var(--for-color,#ff3c3c), 0 0 40px var(--for-glow,rgba(255,60,60,0.9)), 0 0 80px var(--for-glow2,rgba(200,0,0,0.5)); }
    }
    .word-the { color: rgba(255,255,255,0.75); cursor: pointer; user-select: none; transition: color 0.2s, text-shadow 0.2s; }
    .word-the:hover { color: var(--green); text-shadow: 0 0 12px var(--green), 0 0 30px rgba(63,255,168,0.4); }
    .word-reroll { color: var(--green); animation: glowGreen 2.5s ease-in-out infinite alternate; cursor: pointer; user-select: none; transition: opacity 0.2s; }
    .word-reroll:hover { opacity: 0.75; }
    @keyframes glowGreen {
      from { text-shadow: 0 0 6px var(--green), 0 0 18px rgba(63,255,168,0.5); }
      to   { text-shadow: 0 0 14px var(--green), 0 0 40px rgba(63,255,168,0.8), 0 0 80px rgba(0,180,100,0.4); }
    }
    .info-badge {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.18);
      padding: 2px 10px; border-radius: 20px; font-size: 0.72rem;
      font-weight: 500; color: #fff; letter-spacing: 0.3px; user-select: none;
    }
    .btn-outline-warning {
      border: 1px solid rgba(255,190,0,0.5) !important; color: #ffc400 !important;
      background: rgba(255,190,0,0.06) !important; border-radius: 8px !important;
      font-size: 0.72rem !important; letter-spacing: 1px;
      padding: 3px 14px !important; transition: all 0.2s !important; user-select: none;
    }
    .btn-outline-warning:hover { background: rgba(255,190,0,0.16) !important; border-color: #ffc400 !important; box-shadow: 0 0 16px rgba(255,190,0,0.25) !important; }
    .title-img {
      height: 82px; width: 82px; border-radius: 50%;
      object-fit: cover; object-position: center top;
      border: 2px solid var(--red);
      box-shadow: 0 0 10px var(--red-glow), 0 0 28px rgba(255,40,40,0.3);
      display: block; cursor: pointer;
      animation: spinAvatar 8s linear infinite; animation-play-state: paused;
      transition: box-shadow 0.3s; user-select: none; pointer-events: none;
    }
    .title-img.playing { animation-play-state: running; box-shadow: 0 0 18px var(--red-glow), 0 0 50px rgba(255,40,40,0.45), 0 0 90px rgba(200,0,0,0.25); }
    @keyframes spinAvatar { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .track-name { display: none; }
    .col-custom-5 { flex: 0 0 auto; width: 20%; }
    .boss-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      margin-bottom: 10px; padding: 14px; min-height: 230px;
      display: flex; flex-direction: column;
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
      position: relative; z-index: 1; overflow: hidden;
    }
    .boss-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255,60,60,0.4), transparent);
      opacity: 0; transition: opacity 0.2s;
    }
    .boss-card:hover::before { opacity: 1; }
    .boss-card:hover { transform: translateY(-3px); background: var(--surface-hover); border-color: var(--border-hover); box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 0 1px rgba(63,255,168,0.08); }
    .boss-card.defeated { opacity: 0.2; filter: grayscale(1) brightness(0.6); }
    .boss-name {
      font-family: 'Rajdhani', sans-serif; color: #fff; font-size: 1rem; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 7px; display: block; letter-spacing: 0.5px; user-select: none;
    }
    .boss-meta { display: flex; align-items: center; gap: 7px; margin-bottom: 9px; flex-wrap: wrap; }
    .region-tag { font-size: 0.6rem; font-weight: 700; padding: 2px 7px; border-radius: 4px; text-transform: uppercase; display: inline-block; letter-spacing: 0.5px; user-select: none; }
    .loc-text { font-size: 0.73rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; user-select: none; }
    .note-display {
      font-size: 0.85rem; font-weight: 500; padding: 9px 11px;
      background: rgba(0,0,0,0.35); border-left: 3px solid rgba(63,255,168,0.3);
      border-radius: 6px; height: 78px; display: block;
      word-break: break-word; overflow-y: auto; margin-top: auto; text-align: left;
      scrollbar-width: thin; scrollbar-color: rgba(63,255,168,0.3) transparent;
      user-select: none; line-height: 1.5;
    }
    .btn-pem {
      background: linear-gradient(135deg, rgba(30,58,95,0.9), rgba(42,82,152,0.9));
      border: 1px solid rgba(74,127,212,0.5); color: #a8d4ff; border-radius: 7px;
      font-size: 0.78rem; letter-spacing: 1px; transition: all 0.18s; user-select: none;
    }
    .btn-pem:hover { background: linear-gradient(135deg, rgba(42,82,152,1), rgba(30,58,95,1)); border-color: #6aa3f5; color: #fff; box-shadow: 0 0 14px rgba(74,127,212,0.35); }
    .btn-secondary {
      background: rgba(255,255,255,0.07) !important; border: 1px solid rgba(255,255,255,0.15) !important;
      color: rgba(255,255,255,0.5) !important; border-radius: 7px !important;
      font-size: 0.78rem !important; letter-spacing: 1px; user-select: none;
    }
    .btn, .revive-btn-wrap button, .btn-warning { user-select: none; }
    .loading-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none;
      justify-content: center; align-items: center; z-index: 999; backdrop-filter: blur(4px);
    }
    .modal-content { background: rgba(12,12,22,0.97); backdrop-filter: blur(20px); border: 1px solid rgba(255,60,60,0.3); border-radius: 14px; color: #fff; }
    .modal-header { border-bottom: 1px solid rgba(255,255,255,0.08); }
    .modal-footer { border-top: 1px solid rgba(255,255,255,0.08); }
    .container-fluid { position: relative; z-index: 1; }

    /* ── PLAYLIST MODAL ── */
    #playlistModal .modal-dialog { max-width: 640px; }
    #playlistModal .modal-content { border-color: rgba(63,255,168,0.2); }
    .pl-tabs-wrap { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
    .pl-tab {
      padding: 5px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04); color: var(--muted); font-family: 'Rajdhani', sans-serif;
      font-size: 0.85rem; font-weight: 700; letter-spacing: 1.5px; cursor: pointer;
      transition: all 0.2s; display: flex; align-items: center; gap: 6px;
    }
    .pl-tab.active { color: #fff; }
    .pl-tab:hover:not(.active) { background: rgba(255,255,255,0.08); color: #fff; }
    .pl-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .pl-tab-add {
      padding: 5px 12px; border-radius: 8px; border: 1px dashed rgba(63,255,168,0.35);
      background: transparent; color: rgba(63,255,168,0.6); font-size: 0.78rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s; letter-spacing: 1px;
    }
    .pl-tab-add:hover { border-color: var(--green); color: var(--green); background: rgba(63,255,168,0.06); }
    .pl-track-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; min-height: 40px; max-height: 200px; overflow-y: auto;
      scrollbar-width: thin; scrollbar-color: rgba(63,255,168,0.3) transparent; }
    .pl-track-item {
      display: flex; align-items: center; gap: 10px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px; padding: 7px 12px; transition: border-color 0.15s;
    }
    .pl-track-item:hover { border-color: rgba(255,255,255,0.18); }
    .pl-track-num { color: var(--muted); font-size: 0.7rem; width: 18px; flex-shrink: 0; text-align: right; }
    .pl-track-info { flex: 1; min-width: 0; }
    .pl-track-title { font-weight: 600; font-size: 0.83rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pl-track-url { font-size: 0.67rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pl-del-btn {
      background: rgba(255,60,60,0.08); border: 1px solid rgba(255,60,60,0.25); color: var(--red);
      border-radius: 6px; padding: 2px 9px; font-size: 0.7rem; cursor: pointer;
      transition: all 0.15s; flex-shrink: 0;
    }
    .pl-del-btn:hover { background: rgba(255,60,60,0.22); border-color: var(--red); }
    .pl-add-section { border-top: 1px solid rgba(255,255,255,0.06); padding-top: 12px; margin-top: 6px; }
    .pl-add-title { font-size: 0.75rem; color: var(--green); font-weight: 600; letter-spacing: 1px; margin-bottom: 9px; }
    .pl-input {
      width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px; color: #fff; padding: 7px 12px; font-size: 0.81rem;
      transition: border-color 0.2s; outline: none; margin-bottom: 7px;
    }
    .pl-input:focus { border-color: rgba(63,255,168,0.45); box-shadow: 0 0 0 2px rgba(63,255,168,0.07); }
    .pl-input::placeholder { color: rgba(255,255,255,0.22); }
    .pl-hint { font-size: 0.67rem; color: var(--muted); margin-bottom: 10px; }
    .pl-hint span { color: #ffc400; }
    .pl-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .btn-pl-add {
      background: rgba(63,255,168,0.1); border: 1px solid rgba(63,255,168,0.35); color: var(--green);
      border-radius: 8px; padding: 5px 16px; font-size: 0.78rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s; letter-spacing: 1px;
    }
    .btn-pl-add:hover { background: rgba(63,255,168,0.2); border-color: var(--green); }
    .btn-pl-del-list {
      background: rgba(255,60,60,0.08); border: 1px solid rgba(255,60,60,0.25); color: var(--red);
      border-radius: 8px; padding: 5px 14px; font-size: 0.78rem; font-weight: 600;
      cursor: pointer; transition: all 0.2s; letter-spacing: 1px;
    }
    .btn-pl-del-list:hover { background: rgba(255,60,60,0.2); border-color: var(--red); }
    .btn-pl-save {
      background: linear-gradient(135deg, rgba(255,190,0,0.18), rgba(255,150,0,0.18));
      border: 1px solid rgba(255,190,0,0.45); color: #ffc400;
      border-radius: 8px; padding: 5px 20px; font-size: 0.78rem; font-weight: 700;
      cursor: pointer; transition: all 0.2s; letter-spacing: 1px; margin-left: auto;
    }
    .btn-pl-save:hover { background: linear-gradient(135deg, rgba(255,190,0,0.32), rgba(255,150,0,0.32)); }
    .pl-count { font-size: 0.7rem; color: var(--muted); margin-bottom: 8px; }
    .pl-save-status { font-size: 0.7rem; padding: 3px 10px; border-radius: 6px; display: none; }
    .pl-save-status.ok { background: rgba(63,255,168,0.1); color: var(--green); border: 1px solid rgba(63,255,168,0.28); display: inline-block; }
    .pl-save-status.err { background: rgba(255,60,60,0.1); color: var(--red); border: 1px solid rgba(255,60,60,0.28); display: inline-block; }
    .pl-empty { color: var(--muted); font-size: 0.78rem; text-align: center; padding: 14px 0; }
    .pl-meta-row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; flex-wrap: wrap; }
    .pl-name-label { font-size: 0.72rem; color: var(--muted); flex-shrink: 0; }
    .pl-name-input {
      flex: 1; min-width: 120px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px; color: #fff; padding: 4px 10px; font-size: 0.78rem; outline: none;
      transition: border-color 0.2s;
    }
    .pl-name-input:focus { border-color: rgba(63,255,168,0.4); }
    .pl-color-label { font-size: 0.72rem; color: var(--muted); flex-shrink: 0; }
    .pl-color-opts { display: flex; gap: 6px; align-items: center; }
    .pl-color-opt {
      width: 18px; height: 18px; border-radius: 50%; cursor: pointer;
      border: 2px solid transparent; transition: all 0.15s; flex-shrink: 0;
    }
    .pl-color-opt.selected { border-color: #fff; transform: scale(1.25); }
  </style>
</head>
<body>
  <div id="loading" class="loading-overlay">
    <div class="spinner-border text-info"></div>
  </div>

  <!-- Revive Modal -->
  <div class="modal fade" id="reviveModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title text-warning fw-bold">⚠️ Xác nhận</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="reviveModalBody">Hồi sinh tất cả?</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Huỷ</button>
          <button type="button" class="btn btn-warning fw-bold" id="reviveConfirmBtn">OK</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Playlist Modal -->
  <div class="modal fade" id="playlistModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content p-3">
        <div class="modal-header border-0 pb-1 pt-1">
          <h5 class="modal-title fw-bold" style="font-family:'Rajdhani',sans-serif;letter-spacing:3px;font-size:1.05rem;">
            🎵 QUẢN LÝ PLAYLIST
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body pt-2">
          <div class="pl-tabs-wrap" id="plTabsWrap"></div>
          <div class="pl-meta-row">
            <span class="pl-name-label">Tên:</span>
            <input class="pl-name-input" id="plNameInput" placeholder="Tên playlist">
            <span class="pl-color-label">Màu:</span>
            <div class="pl-color-opts" id="plColorOpts"></div>
          </div>
          <div class="pl-count" id="plCount"></div>
          <div class="pl-track-list" id="plTrackList"></div>
          <div class="pl-add-section">
            <div class="pl-add-title">+ THÊM BÀI MỚI</div>
            <input class="pl-input" id="plInputTitle" placeholder="Tên bài (hiển thị trên player)">
            <input class="pl-input" id="plInputUrl" placeholder="soundcloud.com/artist/song">
            <div class="pl-hint"><span>⚠</span> Chỉ paste link thường — KHÔNG paste thẻ &lt;iframe&gt;</div>
            <div class="pl-actions">
              <button class="btn-pl-add" onclick="plAddTrack()">Thêm bài</button>
              <button class="btn-pl-del-list" onclick="plDeleteList()">Xoá playlist</button>
              <span class="pl-save-status" id="plSaveStatus"></span>
              <button class="btn-pl-save" onclick="plSave()">💾 Lưu</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <iframe id="scPlayer" src="about:blank" allow="autoplay" scrolling="no" frameborder="no"></iframe>

  <div id="header">
    <div class="container-fluid px-4">
      <div class="header-wrap">
        <div class="header-left" style="user-select:none;">
          <select id="acc-select" class="form-select" onchange="loadBosses()">
            <option value="">-- Acc --</option>
            <option value="karins">karins</option>
            <option value="karinx">karinx</option>
            <option value="godcat">godcat</option>
            <option value="duong">duong</option>
          </select>
          <select id="region-select" class="form-select" onchange="filterByRegion()">
            <option value="all">Tất cả Region</option>
            <option value="kanto">Kanto</option>
            <option value="johto">Johto</option>
            <option value="hoenn">Hoenn</option>
            <option value="sinnoh">Sinnoh</option>
          </select>
        </div>
        <div class="header-center">
          <div class="main-title">
            <span class="word-pve">PVE</span>
            <span class="word-for" id="forBtn" onclick="switchPlaylist()" title="Đổi playlist">FOR</span>
            <span class="word-the" onclick="openPlaylistManager()" title="Quản lý playlist">THE</span>
            <span class="word-reroll" onclick="rerollTrack()" title="Random bài khác">REROLLLLLL</span>
          </div>
          <div class="badges-row">
            <span class="info-badge">Hàng đợi: <span id="totalOwned">0</span></span>
            <span class="info-badge badge-t1">Tuần 1: <span id="pemT1">0/20</span></span>
            <span class="info-badge badge-t2">Tuần 2: <span id="pemT2">0/20</span></span>
          </div>
          <div class="revive-btn-wrap">
            <button class="btn btn-outline-warning btn-sm fw-bold" onclick="handleReviveAll()">HỒI SINH TẤT CẢ</button>
          </div>
        </div>
        <div class="header-right">
          <div style="display:flex;flex-direction:column;align-items:center;margin-left:-160px;user-select:none;cursor:pointer;" onclick="toggleMusic()" title="Play / Pause">
            <img id="musicImg" src="https://drive.google.com/thumbnail?id=1vs_KUBu829bGCS8nZXYI_-lGjFgFEOne&sz=w300" class="title-img" alt="Music" draggable="false" tabindex="-1">
          </div>
          <div class="track-name" id="trackName">Bấm để phát nhạc</div>
        </div>
      </div>
    </div>
  </div>

  <div class="container-fluid px-4 mt-2">
    <div id="bossList" class="row"></div>
  </div>

<script>
var GAS_URL = 'https://script.google.com/macros/s/AKfycbytSfqVD5DMg-X3VMX8gm9M03JUZ-ejrPiw26_ECrzEB48rNXzMdlwsbXwiS5ERikDf/exec';

var PALETTE = [
  { hex: '#ff3c3c', glow: 'rgba(255,60,60,0.7)',   glow2: 'rgba(200,0,0,0.5)' },
  { hex: '#4d9fff', glow: 'rgba(77,159,255,0.7)',  glow2: 'rgba(0,80,200,0.5)' },
  { hex: '#3fffa8', glow: 'rgba(63,255,168,0.7)',  glow2: 'rgba(0,180,100,0.5)' },
  { hex: '#ff9f3c', glow: 'rgba(255,159,60,0.7)',  glow2: 'rgba(200,80,0,0.5)' },
  { hex: '#c97fff', glow: 'rgba(201,127,255,0.7)', glow2: 'rgba(120,0,200,0.5)' },
  { hex: '#ffee3c', glow: 'rgba(255,238,60,0.7)',  glow2: 'rgba(180,160,0,0.5)' },
  { hex: '#ff5faa', glow: 'rgba(255,95,170,0.7)',  glow2: 'rgba(180,0,100,0.5)' },
  { hex: '#3cfff5', glow: 'rgba(60,255,245,0.7)',  glow2: 'rgba(0,160,180,0.5)' },
];

var PLAYLISTS = [
  { name: 'Playlist A', color: 0, tracks: [] },
  { name: 'Playlist B', color: 1, tracks: [] },
];

var currentPlIdx      = 0;
var currentTrackIndex = -1;
var isPlaying         = false;
var currentData       = null;
var reviveModal       = null;
var playlistModal     = null;
var queues            = [[], []];
var _widget           = null;
var activePlTab       = 0;

// ═══════════════════════════════════════════
//  JSONP
// ═══════════════════════════════════════════
function jsonp(url, callback) {
  var name = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 99999);
  window[name] = function(data) {
    delete window[name];
    if (script.parentNode) script.parentNode.removeChild(script);
    callback(data);
  };
  var script = document.createElement('script');
  script.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + name;
  script.onerror = function() {
    delete window[name];
    if (script.parentNode) script.parentNode.removeChild(script);
    callback(null);
  };
  document.head.appendChild(script);
}

// ═══════════════════════════════════════════
//  LOAD PLAYLISTS
// ═══════════════════════════════════════════
jsonp(GAS_URL + '?action=getPlaylists', function(data) {
  if (!data) return;
  if (Array.isArray(data)) {
    PLAYLISTS = data;
  } else {
    var arr = [];
    if (data.a) arr.push({ name: 'Playlist A', color: 0, tracks: data.a.tracks || [] });
    if (data.b) arr.push({ name: 'Playlist B', color: 1, tracks: data.b.tracks || [] });
    if (arr.length) PLAYLISTS = arr;
  }
  queues = PLAYLISTS.map(function(){ return []; });
  updateForBtn();
});

// ═══════════════════════════════════════════
//  FOR BUTTON
// ═══════════════════════════════════════════
function updateForBtn() {
  var pl = PLAYLISTS[currentPlIdx];
  if (!pl) return;
  var c = PALETTE[pl.color % PALETTE.length];
  var btn = document.getElementById('forBtn');
  btn.style.color = c.hex;
  btn.style.setProperty('--for-color', c.hex);
  btn.style.setProperty('--for-glow',  c.glow);
  btn.style.setProperty('--for-glow2', c.glow2);
}

// ═══════════════════════════════════════════
//  PLAYLIST MANAGER
// ═══════════════════════════════════════════
function openPlaylistManager() {
  activePlTab = currentPlIdx;
  renderPlModal();
  playlistModal.show();
}

function renderPlModal() {
  // Tabs
  var wrap = document.getElementById('plTabsWrap');
  wrap.innerHTML = '';
  PLAYLISTS.forEach(function(pl, i) {
    var c = PALETTE[pl.color % PALETTE.length];
    var btn = document.createElement('button');
    btn.className = 'pl-tab' + (i === activePlTab ? ' active' : '');
    if (i === activePlTab) { btn.style.borderColor = c.hex; btn.style.color = c.hex; }
    btn.innerHTML = '<span class="pl-dot" style="background:' + c.hex + '"></span>' + escHtml(pl.name);
    btn.onclick = (function(idx){ return function(){ activePlTab = idx; renderPlModal(); }; })(i);
    wrap.appendChild(btn);
  });
  var addBtn = document.createElement('button');
  addBtn.className = 'pl-tab-add';
  addBtn.innerText = '+ Thêm list';
  addBtn.onclick = plAddList;
  wrap.appendChild(addBtn);

  renderPlTabContent();
}

function renderPlTabContent() {
  var pl = PLAYLISTS[activePlTab];
  if (!pl) return;

  // Name
  var nameInp = document.getElementById('plNameInput');
  nameInp.value = pl.name;
  nameInp.oninput = function() { PLAYLISTS[activePlTab].name = this.value; };

  // Color picker
  var opts = document.getElementById('plColorOpts');
  opts.innerHTML = '';
  PALETTE.forEach(function(c, i) {
    var dot = document.createElement('div');
    dot.className = 'pl-color-opt' + (pl.color === i ? ' selected' : '');
    dot.style.background = c.hex;
    dot.onclick = (function(idx){ return function() {
      PLAYLISTS[activePlTab].color = idx;
      if (activePlTab === currentPlIdx) updateForBtn();
      renderPlModal();
    }; })(i);
    opts.appendChild(dot);
  });

  // Tracks
  var tracks = pl.tracks;
  document.getElementById('plCount').innerText = escHtml(pl.name) + ': ' + tracks.length + ' bài';
  var list = document.getElementById('plTrackList');
  if (!tracks.length) {
    list.innerHTML = '<div class="pl-empty">Chưa có bài nào</div>';
  } else {
    list.innerHTML = tracks.map(function(t, i) {
      return '<div class="pl-track-item">' +
        '<span class="pl-track-num">' + (i+1) + '</span>' +
        '<div class="pl-track-info">' +
          '<div class="pl-track-title">' + escHtml(t.title) + '</div>' +
          '<div class="pl-track-url">' + escHtml(t.url) + '</div>' +
        '</div>' +
        '<button class="pl-del-btn" onclick="plDeleteTrack(' + i + ')">Xoá</button>' +
      '</div>';
    }).join('');
  }
  document.getElementById('plInputTitle').value = '';
  document.getElementById('plInputUrl').value = '';
}

function plAddList() {
  PLAYLISTS.push({ name: 'Playlist ' + (PLAYLISTS.length + 1), color: PLAYLISTS.length % PALETTE.length, tracks: [] });
  queues.push([]);
  activePlTab = PLAYLISTS.length - 1;
  renderPlModal();
}

function plDeleteList() {
  if (PLAYLISTS.length <= 1) return;
  PLAYLISTS.splice(activePlTab, 1);
  queues.splice(activePlTab, 1);
  if (currentPlIdx >= PLAYLISTS.length) { currentPlIdx = 0; updateForBtn(); }
  activePlTab = Math.min(activePlTab, PLAYLISTS.length - 1);
  renderPlModal();
}

function plAddTrack() {
  var title = document.getElementById('plInputTitle').value.trim();
  var url   = document.getElementById('plInputUrl').value.trim();
  if (!title || !url) return;
  url = url.replace(/^https?:\/\/w\.soundcloud\.com\/player\/\?url=/, '');
  try { url = decodeURIComponent(url); } catch(e) {}
  if (!url.startsWith('http')) url = 'https://' + url;
  PLAYLISTS[activePlTab].tracks.push({ title: title, url: url });
  renderPlTabContent();
}

function plDeleteTrack(idx) {
  PLAYLISTS[activePlTab].tracks.splice(idx, 1);
  renderPlTabContent();
}

function plSave() {
  var status = document.getElementById('plSaveStatus');
  status.className = 'pl-save-status';
  status.innerText = 'Đang lưu...';
  status.style.display = 'inline-block';
  jsonp(GAS_URL + '?action=savePlaylists&data=' + encodeURIComponent(JSON.stringify(PLAYLISTS)), function(res) {
    if (res && res.ok) {
      status.className = 'pl-save-status ok';
      status.innerText = '✓ Đã lưu';
      queues = PLAYLISTS.map(function(){ return []; });
    } else {
      status.className = 'pl-save-status err';
      status.innerText = '✗ Lỗi lưu';
    }
    setTimeout(function(){ status.style.display = 'none'; }, 2500);
  });
}

function escHtml(s) {
  if (!s) return '';
  return s.toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ═══════════════════════════════════════════
//  QUEUE / SHUFFLE — fixed
// ═══════════════════════════════════════════
function buildQueue(plIdx, excludeIdx) {
  var tracks = PLAYLISTS[plIdx] ? PLAYLISTS[plIdx].tracks : [];
  var len = tracks.length;
  var pool = [];
  for (var i = 0; i < len; i++) {
    if (len === 1 || i !== excludeIdx) pool.push(i);
  }
  for (var i = pool.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = pool[i]; pool[i] = pool[j]; pool[j] = t;
  }
  if (!queues[plIdx]) queues[plIdx] = [];
  queues[plIdx] = pool;
}

function popNext(plIdx) {
  if (!queues[plIdx] || !queues[plIdx].length) buildQueue(plIdx, -1);
  if (!queues[plIdx] || !queues[plIdx].length) return 0;
  return queues[plIdx].shift();
}

function buildEmbedUrl(trackUrl) {
  return 'https://w.soundcloud.com/player/?url='
    + encodeURIComponent(trackUrl)
    + '&auto_play=true&buying=false&sharing=false'
    + '&show_artwork=false&show_comments=false'
    + '&show_playcount=false&show_user=false&hide_related=true';
}

// ═══════════════════════════════════════════
//  SC WIDGET
// ═══════════════════════════════════════════
function setSrc(src) {
  var iframe = document.getElementById('scPlayer');
  if (_widget) {
    try { _widget.unbind(SC.Widget.Events.FINISH); } catch(e) {}
    _widget = null;
  }
  iframe.src = 'about:blank';
  if (src === 'about:blank') return;
  setTimeout(function() {
    iframe.src = src;
    _widget = SC.Widget(iframe);
    _widget.bind(SC.Widget.Events.READY, function() {
      _widget.bind(SC.Widget.Events.FINISH, function() {
        if (!isPlaying) return;
        playTrack(currentPlIdx, popNext(currentPlIdx));
      });
    });
  }, 150);
}

function playTrack(plIdx, trackIndex) {
  var pl = PLAYLISTS[plIdx];
  if (!pl || !pl.tracks[trackIndex]) return;
  currentPlIdx      = plIdx;
  currentTrackIndex = trackIndex;
  setSrc(buildEmbedUrl(pl.tracks[trackIndex].url));
  setPlayingUI(true);
  updateForBtn();
}

function setPlayingUI(playing) {
  isPlaying = playing;
  document.getElementById('musicImg').classList.toggle('playing', playing);
}

function toggleMusic() {
  if (!isPlaying) {
    if (currentTrackIndex === -1) {
      buildQueue(currentPlIdx, -1);
      playTrack(currentPlIdx, popNext(currentPlIdx));
    } else {
      setSrc(buildEmbedUrl(PLAYLISTS[currentPlIdx].tracks[currentTrackIndex].url));
      setPlayingUI(true);
    }
  } else {
    setSrc('about:blank');
    setPlayingUI(false);
  }
}

function switchPlaylist() {
  var nextIdx = (currentPlIdx + 1) % PLAYLISTS.length;
  currentPlIdx = nextIdx;
  buildQueue(nextIdx, -1);
  var idx = popNext(nextIdx);
  if (isPlaying) { playTrack(nextIdx, idx); }
  else { currentTrackIndex = idx; updateForBtn(); }
}

function rerollTrack() {
  buildQueue(currentPlIdx, currentTrackIndex);
  playTrack(currentPlIdx, popNext(currentPlIdx));
}

// ═══════════════════════════════════════════
//  BOSS LIST
// ═══════════════════════════════════════════
document.addEventListener('DOMContentLoaded', function() {
  reviveModal   = new bootstrap.Modal(document.getElementById('reviveModal'));
  playlistModal = new bootstrap.Modal(document.getElementById('playlistModal'));
  updateForBtn();
});

function showLoading(show) {
  document.getElementById('loading').style.display = show ? 'flex' : 'none';
}

function formatNote(noteText) {
  if (!noteText || noteText === '---') return '<span style="color:#666">---</span>';
  var text = noteText.toString().replace(/,/g, ',<br>');
  var rules = [
    { pattern: /mega/gi, color: '#ff4d4d' },
    { pattern: /dance x3/gi, color: '#ffff4d' },
    { pattern: /vịt|lumbery|crun/gi, color: '#4da6ff' },
    { pattern: /rải đá/gi, color: '#4dff4d' },
  ];
  var html = text;
  rules.forEach(function(r) {
    html = html.replace(new RegExp('(' + r.pattern.source + ')', 'gi'), '<span style="color:' + r.color + '">$1</span>');
  });
  return '<div style="color:#e0e0e0;line-height:1.5;">' + html + '</div>';
}

function loadBosses() {
  var acc = document.getElementById('acc-select').value;
  if (!acc) return;
  showLoading(true);
  jsonp(GAS_URL + '?action=getBossData&acc=' + encodeURIComponent(acc), function(data) {
    if (!data) { showLoading(false); return; }
    currentData = data;
    filterByRegion();
  });
}

function filterByRegion() {
  if (!currentData) return;
  var region = document.getElementById('region-select').value.toLowerCase();
  var list = region === 'all'
    ? currentData.bossList
    : currentData.bossList.filter(function(b){ return b.region.toLowerCase().includes(region); });
  renderUI(list, currentData.totalDefeated);
}

function renderUI(bossArray, totalDefeated) {
  showLoading(false);
  var list = document.getElementById('bossList');
  list.innerHTML = '';
  var t1 = totalDefeated <= 20 ? totalDefeated : 20;
  var t2 = totalDefeated > 20 ? Math.min(totalDefeated - 20, 20) : 0;
  document.getElementById('totalOwned').innerText = bossArray.length;
  document.getElementById('pemT1').innerText = t1 + '/20';
  document.getElementById('pemT2').innerText = t2 + '/20';
  bossArray.forEach(function(boss) {
    var defeated = boss.status === 1;
    var col = document.createElement('div');
    col.className = 'col-custom-5 sort-item';
    col.innerHTML =
      '<div class="boss-card' + (defeated ? ' defeated' : '') + '">' +
        '<div class="boss-name" title="' + boss.name + '">' + boss.name + '</div>' +
        '<div class="boss-meta">' +
          '<span class="region-tag" style="background-color:' + boss.regionBg + ';color:' + boss.regionFont + ';">' + boss.region + '</span>' +
          '<span class="loc-text" title="' + boss.location + '">📍 ' + boss.location + '</span>' +
        '</div>' +
        '<div class="note-display">' + formatNote(boss.note) + '</div>' +
        '<div class="mt-3">' +
          '<button class="btn ' + (defeated ? 'btn-secondary' : 'btn-pem') + ' btn-sm w-100 fw-bold"' +
          ' onclick="updateLocal(\'' + boss.id + '\',' + (defeated ? 0 : 1) + ')">' +
          (defeated ? 'HỒI SINH' : 'PEM') + '</button>' +
        '</div>' +
      '</div>';
    list.appendChild(col);
  });
  new Sortable(list, { animation: 150 });
}

function updateLocal(bossId, newStatus) {
  var acc = document.getElementById('acc-select').value;
  if (!acc) return;
  currentData.bossList.forEach(function(b){ if (b.id == bossId) b.status = newStatus; });
  if (newStatus === 1) currentData.totalDefeated++;
  else currentData.totalDefeated--;
  filterByRegion();
  jsonp(GAS_URL + '?action=updateStatus&acc=' + encodeURIComponent(acc)
    + '&bossId=' + encodeURIComponent(bossId)
    + '&action2=' + (newStatus === 1 ? 'fight' : 'revive'), function(){});
}

function handleReviveAll() {
  var acc = document.getElementById('acc-select').value;
  if (!acc) return;
  document.getElementById('reviveModalBody').innerText = 'Hồi sinh tất cả cho ' + acc + '?';
  reviveModal.show();
  document.getElementById('reviveConfirmBtn').onclick = function() {
    reviveModal.hide();
    showLoading(true);
    jsonp(GAS_URL + '?action=reviveAll&acc=' + encodeURIComponent(acc), function() {
      loadBosses();
    });
  };
}
</script>
</body>
</html>
