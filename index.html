<!DOCTYPE html>
<html>
<head>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <script src="https://w.soundcloud.com/player/api.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --red:    #ff3c3c;
      --red-glow: rgba(255,60,60,0.55);
      --green:  #3fffa8;
      --blue:   #4d9fff;
      --bg:     #0d0d14;
      --surface: rgba(255,255,255,0.045);
      --surface-hover: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.09);
      --border-hover: rgba(63,255,168,0.45);
      --text:   #f0f0f0;
      --muted:  rgba(255,255,255,0.45);
    }
    * { box-sizing: border-box; }
    body {
      background-color: var(--bg); color: var(--text);
      font-family: 'Inter', 'Segoe UI', sans-serif;
      padding-bottom: 60px; position: relative; min-height: 100vh;
    }
    body::before {
      content: ''; position: fixed; inset: 0;
      background-image: url('https://drive.google.com/thumbnail?id=1lZ8dw3517sG9HX6HVAt-WChH7yiv_BNk&sz=w1000');
      background-size: cover; background-position: center; background-attachment: fixed;
      opacity: 0.06; z-index: 0; pointer-events: none;
    }
    body::after {
      content: ''; position: fixed; inset: 0;
      background: radial-gradient(ellipse at 50% 0%, rgba(255,60,60,0.07) 0%, transparent 65%);
      z-index: 0; pointer-events: none;
    }
    #scPlayer {
      position: fixed; bottom: -300px; left: 0;
      width: 100%; height: 166px;
      border: none; z-index: -1; pointer-events: none;
    }
    #header {
      position: sticky; top: 0;
      background: rgba(10,10,18,0.88);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      z-index: 100; padding: 6px 20px;
      border-bottom: 1px solid rgba(255,60,60,0.3);
      box-shadow: 0 2px 40px rgba(0,0,0,0.6);
    }
    .header-wrap { display: flex; align-items: center; width: 100%; min-height: 68px; gap: 16px; overflow: hidden; }
    .header-left {
      width: 220px; flex-shrink: 0; display: flex; flex-direction: row;
      gap: 8px; align-items: center; align-self: center; border: none;
    }
    .header-right { width: 220px; flex-shrink: 0; display: flex; justify-content: flex-start; align-items: center; }
    .header-center { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; }
    .form-select {
      background-color: #0f0f1a !important; border: 1px solid rgba(255,255,255,0.12) !important;
      color: #fff !important; border-radius: 8px !important;
      font-size: 0.75rem; transition: border-color 0.2s; padding: 4px 8px;
    }
    .form-select:focus { border-color: var(--green) !important; box-shadow: 0 0 0 2px rgba(63,255,168,0.15) !important; outline: none !important; }
    .form-select:focus-visible { outline: none !important; }
    .header-left, .header-left * { user-select: none; cursor: default; }
    select.form-select { cursor: pointer; }
    .form-select option { background-color: #0f0f1a; color: #fff; }
    .main-title {
      font-family: 'Rajdhani', sans-serif; font-size: 1.55rem; font-weight: 700;
      letter-spacing: 4px; display: flex; align-items: center; gap: 10px;
      margin: 0; white-space: nowrap; user-select: none;
    }
    .badges-row { display: flex; gap: 6px; align-items: center; justify-content: center; user-select: none; }
    .revive-btn-wrap { display: flex; justify-content: center; }
    .word-pve { color: #ffffff; letter-spacing: 4px; }
    .word-for {
      color: var(--red); animation: glowRed 2.5s ease-in-out infinite alternate;
      cursor: pointer; user-select: none; transition: opacity 0.2s;
    }
    .word-for:hover { opacity: 0.75; }
    .word-for.playlist-b { color: var(--blue); animation: glowBlue 2.5s ease-in-out infinite alternate; }
    .word-the {
      color: rgba(255,255,255,0.75); cursor: pointer; user-select: none;
      transition: color 0.2s, text-shadow 0.2s;
    }
    .word-the:hover { color: var(--green); text-shadow: 0 0 12px var(--green), 0 0 30px rgba(63,255,168,0.4); }
    .word-reroll {
      color: var(--green); animation: glowGreen 2.5s ease-in-out infinite alternate;
      cursor: pointer; user-select: none; transition: opacity 0.2s;
    }
    .word-reroll:hover { opacity: 0.75; }
    @keyframes glowRed {
      from { text-shadow: 0 0 6px var(--red), 0 0 18px rgba(255,60,60,0.6); }
      to   { text-shadow: 0 0 14px var(--red), 0 0 40px rgba(255,60,60,0.9), 0 0 80px rgba(200,0,0,0.5); }
    }
    @keyframes glowBlue {
      from { text-shadow: 0 0 6px var(--blue), 0 0 18px rgba(77,159,255,0.6); }
      to   { text-shadow: 0 0 14px var(--blue), 0 0 40px rgba(77,159,255,0.9), 0 0 80px rgba(0,80,200,0.5); }
    }
    @keyframes glowGreen {
      from { text-shadow: 0 0 6px var(--green), 0 0 18px rgba(63,255,168,0.5); }
      to   { text-shadow: 0 0 14px var(--green), 0 0 40px rgba(63,255,168,0.8), 0 0 80px rgba(0,180,100,0.4); }
    }
    .info-badge {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.18);
      padding: 2px 10px; border-radius: 20px; font-size: 0.72rem;
      font-weight: 500; color: #fff; letter-spacing: 0.3px; user-select: none;
    }
    .badge-t1, .badge-t2 { color: #fff; border-color: rgba(255,255,255,0.25); }
    .btn-outline-warning {
      border: 1px solid rgba(255,190,0,0.5) !important; color: #ffc400 !important;
      background: rgba(255,190,0,0.06) !important; border-radius: 8px !important;
      font-size: 0.72rem !important; letter-spacing: 1px;
      padding: 3px 14px !important; transition: all 0.2s !important; user-select: none;
    }
    .btn-outline-warning:hover {
      background: rgba(255,190,0,0.16) !important; border-color: #ffc400 !important;
      box-shadow: 0 0 16px rgba(255,190,0,0.25) !important;
    }
    .title-img {
      height: 82px; width: 82px; border-radius: 50%;
      object-fit: cover; object-position: center top;
      border: 2px solid var(--red);
      box-shadow: 0 0 10px var(--red-glow), 0 0 28px rgba(255,40,40,0.3);
      display: block; cursor: pointer;
      animation: spinAvatar 8s linear infinite; animation-play-state: paused;
      transition: box-shadow 0.3s; user-select: none; pointer-events: none;
    }
    .title-img.playing { animation-play-state: running; box-shadow: 0 0 18px var(--red-glow), 0 0 50px rgba(255,40,40,0.45), 0 0 90px rgba(200,0,0,0.25); }
    @keyframes spinAvatar { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .track-name { display: none; }
    .col-custom-5 { flex: 0 0 auto; width: 20%; }
    .boss-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      margin-bottom: 10px; padding: 14px; min-height: 230px;
      display: flex; flex-direction: column;
      transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
      position: relative; z-index: 1; overflow: hidden;
    }
    .boss-card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, rgba(255,60,60,0.4), transparent);
      opacity: 0; transition: opacity 0.2s;
    }
    .boss-card:hover::before { opacity: 1; }
    .boss-card:hover {
      transform: translateY(-3px); background: var(--surface-hover); border-color: var(--border-hover);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 0 1px rgba(63,255,168,0.08);
    }
    .boss-card.defeated { opacity: 0.2; filter: grayscale(1) brightness(0.6); }
    .boss-name {
      font-family: 'Rajdhani', sans-serif; color: #fff; font-size: 1rem; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 7px; display: block; letter-spacing: 0.5px; user-select: none;
    }
    .boss-meta { display: flex; align-items: center; gap: 7px; margin-bottom: 9px; flex-wrap: wrap; }
    .region-tag {
      font-size: 0.6rem; font-weight: 700; padding: 2px 7px; border-radius: 4px;
      text-transform: uppercase; display: inline-block; letter-spacing: 0.5px; user-select: none;
    }
    .loc-text { font-size: 0.73rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; user-select: none; }
    .note-display {
      font-size: 0.85rem; font-weight: 500; padding: 9px 11px;
      background: rgba(0,0,0,0.35); border-left: 3px solid rgba(63,255,168,0.3);
      border-radius: 6px; height: 78px; display: block;
      word-break: break-word; overflow-y: auto; margin-top: auto; text-align: left;
      scrollbar-width: thin; scrollbar-color: rgba(63,255,168,0.3) transparent;
      user-select: none; line-height: 1.5;
    }
    .btn-pem {
      background: linear-gradient(135deg, rgba(30,58,95,0.9), rgba(42,82,152,0.9));
      border: 1px solid rgba(74,127,212,0.5); color: #a8d4ff; border-radius: 7px;
      font-size: 0.78rem; letter-spacing: 1px; transition: all 0.18s; user-select: none;
    }
    .btn-pem:hover {
      background: linear-gradient(135deg, rgba(42,82,152,1), rgba(30,58,95,1));
      border-color: #6aa3f5; color: #fff; box-shadow: 0 0 14px rgba(74,127,212,0.35);
    }
    .btn-secondary {
      background: rgba(255,255,255,0.07) !important; border: 1px solid rgba(255,255,255,0.15) !important;
      color: rgba(255,255,255,0.5) !important; border-radius: 7px !important;
      font-size: 0.78rem !important; letter-spacing: 1px; user-select: none;
    }
    .btn, .revive-btn-wrap button, .btn-warning { user-select: none; }
    .loading-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75); display: none;
      justify-content: center; align-items: center; z-index: 999; backdrop-filter: blur(4px);
    }
    .modal-content {
      background: rgba(12,12,22,0.97); backdrop-filter: blur(20px);
      border: 1px solid rgba(255,60,60,0.3); border-radius: 14px; color: #fff;
    }
    .modal-header { border-bottom: 1px solid rgba(255,255,255,0.08); }
    .modal-footer { border-top: 1px solid rgba(255,255,255,0.08); }
    .container-fluid { position: relative; z-index: 1; }
  </style>
</head>
<body>

  <div id="loading" class="loading-overlay">
    <div class="spinner-border text-info"></div>
  </div>

  <div class="modal fade" id="reviveModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title text-warning fw-bold">⚠️ Xác nhận</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="reviveModalBody">Hồi sinh tất cả?</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Huỷ</button>
          <button type="button" class="btn btn-warning fw-bold" id="reviveConfirmBtn">OK</button>
        </div>
      </div>
    </div>
  </div>

  <iframe id="scPlayer"
    src="about:blank"
    allow="autoplay"
    scrolling="no" frameborder="no"></iframe>

  <div id="header">
    <div class="container-fluid px-4">
      <div class="header-wrap">
        <div class="header-left" style="user-select:none;">
          <select id="acc-select" class="form-select" onchange="loadBosses()">
            <option value="">-- Acc --</option>
            <option value="karins">karins</option>
            <option value="karinx">karinx</option>
            <option value="godcat">godcat</option>
            <option value="duong">duong</option>
          </select>
          <select id="region-select" class="form-select" onchange="filterByRegion()">
            <option value="all">Tất cả Region</option>
            <option value="kanto">Kanto</option>
            <option value="johto">Johto</option>
            <option value="hoenn">Hoenn</option>
            <option value="sinnoh">Sinnoh</option>
          </select>
        </div>

        <div class="header-center">
          <div class="main-title">
            <span class="word-pve">PVE</span>
            <span class="word-for" id="forBtn" onclick="switchPlaylist()" title="Đổi playlist">FOR</span>
            <span class="word-the" onclick="openPlaylistManager()" title="Quản lý playlist">THE</span>
            <span class="word-reroll" onclick="rerollTrack()" title="Random bài khác">REROLLLLLL</span>
          </div>
          <div class="badges-row">
            <span class="info-badge">Hàng đợi: <span id="totalOwned">0</span></span>
            <span class="info-badge badge-t1">Tuần 1: <span id="pemT1">0/20</span></span>
            <span class="info-badge badge-t2">Tuần 2: <span id="pemT2">0/20</span></span>
          </div>
          <div class="revive-btn-wrap">
            <button class="btn btn-outline-warning btn-sm fw-bold" onclick="handleReviveAll()">HỒI SINH TẤT CẢ</button>
          </div>
        </div>

        <div class="header-right">
          <div style="display:flex;flex-direction:column;align-items:center;margin-left:-160px;user-select:none;cursor:pointer;" onclick="toggleMusic()" title="Play / Pause">
            <img id="musicImg"
              src="https://drive.google.com/thumbnail?id=1vs_KUBu829bGCS8nZXYI_-lGjFgFEOne&sz=w300"
              class="title-img" alt="Music" draggable="false" tabindex="-1">
          </div>
          <div class="track-name" id="trackName">Bấm để phát nhạc</div>
        </div>
      </div>
    </div>
  </div>

  <div class="container-fluid px-4 mt-2">
    <div id="bossList" class="row"></div>
  </div>

<script>
// ═══════════════════════════════════════════
//  PLAYLIST DATA
// ═══════════════════════════════════════════
var PLAYLISTS = {
  a: { tracks: [
    { title: "Nhạc Boss 1", url: "https://soundcloud.com/nocopyrightsounds/alan-walker-fade" },
    { title: "Nhạc Boss 2", url: "https://soundcloud.com/nocopyrightsounds/elektronomia-sky-high" },
    { title: "Nhạc Boss 3", url: "https://soundcloud.com/nocopyrightsounds/tobu-infectious" },
  ]},
  b: { tracks: [
    { title: "Chill Track 1", url: "https://soundcloud.com/nocopyrightsounds/ship-wrek-zookeepers-ark" },
    { title: "Chill Track 2", url: "https://soundcloud.com/nocopyrightsounds/different-heaven-nekozilla" },
    { title: "Chill Track 3", url: "https://soundcloud.com/nocopyrightsounds/lensko-circles" },
  ]}
};

// ═══════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════
var currentPlaylistKey = 'a';
var currentTrackIndex  = -1;
var isPlaying          = false;
var currentData        = null;
var reviveModal        = null;
var queues             = { a: [], b: [] };
var _loopToken         = 0;
var _pollInterval      = null;

// ═══════════════════════════════════════════
//  LOAD PLAYLISTS TỪ GAS
// ═══════════════════════════════════════════
var _scriptUrl = '';
try {
  google.script.run.withSuccessHandler(function(url){ _scriptUrl = url; }).getScriptUrl();
  google.script.run.withSuccessHandler(function(data){
    PLAYLISTS.a = data.a;
    PLAYLISTS.b = data.b;
    queues.a = []; queues.b = [];
  }).getPlaylists();
} catch(e) {}

function openPlaylistManager() {
  if (!_scriptUrl) { alert('Đang khởi tạo, thử lại sau 1 giây!'); return; }
  var popup = window.open(_scriptUrl + '?page=playlist', 'PlaylistManager', 'width=650,height=580,resizable=yes,scrollbars=yes');
  var timer = setInterval(function() {
    if (popup && popup.closed) {
      clearInterval(timer);
      try {
        google.script.run.withSuccessHandler(function(data){
          PLAYLISTS.a = data.a; PLAYLISTS.b = data.b;
          queues.a = []; queues.b = [];
          currentTrackIndex = -1; isPlaying = false;
          setPlayingUI(false);
          setSrc('about:blank');
        }).getPlaylists();
      } catch(e) {}
    }
  }, 800);
}

// ═══════════════════════════════════════════
//  QUEUE / SHUFFLE
// ═══════════════════════════════════════════
function buildQueue(key, excludeIdx) {
  var len = PLAYLISTS[key].tracks.length;
  var pool = [];
  for (var i = 0; i < len; i++) { if (i !== excludeIdx) pool.push(i); }
  for (var i = pool.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = pool[i]; pool[i] = pool[j]; pool[j] = t;
  }
  queues[key] = pool;
}
function popNext(key) {
  if (!queues[key].length) buildQueue(key, currentTrackIndex);
  return queues[key].shift();
}

// ═══════════════════════════════════════════
//  EMBED URL
// ═══════════════════════════════════════════
function buildEmbedUrl(trackUrl) {
  return 'https://w.soundcloud.com/player/?url='
    + encodeURIComponent(trackUrl)
    + '&auto_play=true'
    + '&buying=false&sharing=false'
    + '&show_artwork=false&show_comments=false'
    + '&show_playcount=false&show_user=false&hide_related=true';
}

// ═══════════════════════════════════════════
//  POLLING HELPERS
// ═══════════════════════════════════════════
function stopPolling() {
  if (_pollInterval) { clearInterval(_pollInterval); _pollInterval = null; }
}

// ═══════════════════════════════════════════
//  setSrc — load iframe + polling getDuration/getPosition để loop
// ═══════════════════════════════════════════
function setSrc(src) {
  _loopToken++;
  var snap = _loopToken;
  var iframe = document.getElementById('scPlayer');

  stopPolling();
  iframe.onload = null;
  iframe.src = 'about:blank';

  if (src === 'about:blank') return;

  setTimeout(function() {
    if (_loopToken !== snap) return;
    iframe.src = src;

    iframe.onload = function() {
      if (_loopToken !== snap) return;
      try {
        var widget = SC.Widget(iframe);
        // Đợi widget sẵn sàng rồi mới bắt đầu poll
        widget.bind(SC.Widget.Events.READY, function() {
          if (_loopToken !== snap) return;
          _pollInterval = setInterval(function() {
            if (_loopToken !== snap || !isPlaying) { stopPolling(); return; }
            widget.getDuration(function(duration) {
              if (!duration) return;
              widget.getPosition(function(position) {
                // Còn dưới 3 giây → reload để loop
                if (duration > 0 && (duration - position) < 3000) {
                  stopPolling();
                  if (_loopToken === snap && isPlaying) setSrc(src);
                }
              });
            });
          }, 2000);
        });
      } catch(e) {}
    };
  }, 150);
}

// ═══════════════════════════════════════════
//  playTrack
// ═══════════════════════════════════════════
function playTrack(playlistKey, trackIndex) {
  var track = PLAYLISTS[playlistKey].tracks[trackIndex];
  if (!track) return;
  currentPlaylistKey = playlistKey;
  currentTrackIndex  = trackIndex;
  setSrc(buildEmbedUrl(track.url));
  setPlayingUI(true);
}

// ═══════════════════════════════════════════
//  CONTROLS
// ═══════════════════════════════════════════
function setPlayingUI(playing) {
  isPlaying = playing;
  document.getElementById('musicImg').classList.toggle('playing', playing);
}

function toggleMusic() {
  if (!isPlaying) {
    if (currentTrackIndex === -1) {
      buildQueue(currentPlaylistKey, -1);
      playTrack(currentPlaylistKey, popNext(currentPlaylistKey));
    } else {
      setSrc(buildEmbedUrl(PLAYLISTS[currentPlaylistKey].tracks[currentTrackIndex].url));
      setPlayingUI(true);
    }
  } else {
    setSrc('about:blank');
    setPlayingUI(false);
  }
}

function switchPlaylist() {
  var nextKey = currentPlaylistKey === 'a' ? 'b' : 'a';
  document.getElementById('forBtn').classList.toggle('playlist-b', nextKey === 'b');
  buildQueue(nextKey, -1);
  var idx = popNext(nextKey);
  if (isPlaying) {
    playTrack(nextKey, idx);
  } else {
    currentPlaylistKey = nextKey;
    currentTrackIndex  = idx;
  }
}

function rerollTrack() {
  buildQueue(currentPlaylistKey, currentTrackIndex);
  playTrack(currentPlaylistKey, popNext(currentPlaylistKey));
}

// ═══════════════════════════════════════════
//  BOSS LIST
// ═══════════════════════════════════════════
document.addEventListener('DOMContentLoaded', function() {
  reviveModal = new bootstrap.Modal(document.getElementById('reviveModal'));
});

function showLoading(show) {
  document.getElementById('loading').style.display = show ? 'flex' : 'none';
}

function formatNote(noteText) {
  if (!noteText || noteText === '---') return '<span style="color:#666">---</span>';
  var text = noteText.toString().replace(/,/g, ',<br>');
  var rules = [
    { pattern: /mega/gi,             color: '#ff4d4d' },
    { pattern: /dance x3/gi,         color: '#ffff4d' },
    { pattern: /vịt|lumbery|crun/gi, color: '#4da6ff' },
    { pattern: /rải đá/gi,           color: '#4dff4d' },
  ];
  var html = text;
  rules.forEach(function(r) {
    html = html.replace(new RegExp('(' + r.pattern.source + ')', 'gi'),
      '<span style="color:' + r.color + '">$1</span>');
  });
  return '<div style="color:#e0e0e0;line-height:1.5;">' + html + '</div>';
}

function loadBosses() {
  var acc = document.getElementById('acc-select').value;
  if (!acc) return;
  showLoading(true);
  google.script.run
    .withSuccessHandler(function(data){ currentData = data; filterByRegion(); })
    .withFailureHandler(function(){ showLoading(false); })
    .getBossData(acc);
}

function filterByRegion() {
  if (!currentData) return;
  var region = document.getElementById('region-select').value.toLowerCase();
  var list = region === 'all'
    ? currentData.bossList
    : currentData.bossList.filter(function(b){ return b.region.toLowerCase().includes(region); });
  renderUI(list, currentData.totalDefeated);
}

function renderUI(bossArray, totalDefeated) {
  showLoading(false);
  var list = document.getElementById('bossList');
  list.innerHTML = '';
  var t1 = totalDefeated <= 20 ? totalDefeated : 20;
  var t2 = totalDefeated > 20  ? Math.min(totalDefeated - 20, 20) : 0;
  document.getElementById('totalOwned').innerText = bossArray.length;
  document.getElementById('pemT1').innerText = t1 + '/20';
  document.getElementById('pemT2').innerText = t2 + '/20';
  bossArray.forEach(function(boss) {
    var defeated = boss.status === 1;
    var col = document.createElement('div');
    col.className = 'col-custom-5 sort-item';
    col.innerHTML =
      '<div class="boss-card' + (defeated ? ' defeated' : '') + '">' +
        '<div class="boss-name" title="' + boss.name + '">' + boss.name + '</div>' +
        '<div class="boss-meta">' +
          '<span class="region-tag" style="background-color:' + boss.regionBg + ';color:' + boss.regionFont + ';">' + boss.region + '</span>' +
          '<span class="loc-text" title="' + boss.location + '">📍 ' + boss.location + '</span>' +
        '</div>' +
        '<div class="note-display">' + formatNote(boss.note) + '</div>' +
        '<div class="mt-3">' +
          '<button class="btn ' + (defeated ? 'btn-secondary' : 'btn-pem') + ' btn-sm w-100 fw-bold"' +
          ' onclick="updateLocal(\'' + boss.id + '\',' + (defeated ? 0 : 1) + ')">' +
          (defeated ? 'HỒI SINH' : 'PEM') + '</button>' +
        '</div>' +
      '</div>';
    list.appendChild(col);
  });
  new Sortable(list, { animation: 150 });
}

function updateLocal(bossId, newStatus) {
  var acc = document.getElementById('acc-select').value;
  if (!acc) return;
  currentData.bossList.forEach(function(b){ if (b.id == bossId) b.status = newStatus; });
  if (newStatus === 1) currentData.totalDefeated++;
  else currentData.totalDefeated--;
  filterByRegion();
  google.script.run.updateStatus(acc, bossId, newStatus === 1 ? 'fight' : 'revive');
}

function handleReviveAll() {
  var acc = document.getElementById('acc-select').value;
  if (!acc) return;
  document.getElementById('reviveModalBody').innerText = 'Hồi sinh tất cả cho ' + acc + '?';
  reviveModal.show();
  document.getElementById('reviveConfirmBtn').onclick = function() {
    reviveModal.hide();
    showLoading(true);
    google.script.run
      .withSuccessHandler(function(){ loadBosses(); })
      .withFailureHandler(function(){ showLoading(false); })
      .reviveAllBosses(acc);
  };
}
</script>
